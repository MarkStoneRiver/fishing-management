{% extends "layout.html" %}
{% block title %}漁場名登録・編集{% endblock %}

{% block head %}
<style>
    .form-wrap {
        max-width: 420px;
        margin: 0 auto;
    }
    .form-group {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .form-group label {
        font-weight: bold;
        min-width: 80px;
        flex-shrink: 0;
    }
    .form-group input {
        flex: 1;
        min-width: 0;
    }
    .btn-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
    }
</style>
{% endblock %}

{% block content %}
<h2 class="page-title">漁場名登録・編集</h2>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="card form-wrap">
    <form method="post">
        <div class="form-group">
            <label for="company_name">漁場名:</label>
            <input type="text" id="company_name" name="company_name"
                   value="{{ company_name if company_name else '' }}" required>
        </div>
        <div class="btn-row">
            <button type="submit" class="btn btn-primary">登録</button>
            <button type="button" class="btn btn-danger" onclick="location.href='/'">キャンセル</button>
        </div>
    </form>
</div>
{% endblock %}
