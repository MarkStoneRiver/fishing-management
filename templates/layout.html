<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}漁獲量管理システム{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">🐟 漁獲管理</a>
            <button class="hamburger" id="hamburger-btn" aria-label="メニュー">&#9776;</button>
            <ul class="navbar-links" id="navbar-links">
                <li><a href="/" {% if active_page == 'home' %}class="active"{% endif %}>ホーム</a></li>
                <li><a href="/fish_receipt/" {% if active_page == 'fish_receipt' %}class="active"{% endif %}>伝票登録</a></li>
                <li><a href="/past_landings/" {% if active_page == 'past_landings' %}class="active"{% endif %}>過去水揚げ</a></li>
                <li><a href="/data_compare/" {% if active_page == 'data_compare' %}class="active"{% endif %}>売買仕切書比較</a></li>
                <li><a href="/fish_code_list" {% if active_page == 'fish_code_list' %}class="active"{% endif %}>魚種コード</a></li>
                <li><a href="/gyoba" {% if active_page == 'gyoba' %}class="active"{% endif %}>漁場名</a></li>
                <li><a href="/buyers" {% if active_page == 'buyers' %}class="active"{% endif %}>買受人</a></li>
                <li><a href="/chat" {% if active_page == 'chat' %}class="active"{% endif %}>AIチャット</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>&copy; 漁獲量管理システム</p>
    </div>

    <script>
        // ハンバーガーメニューの開閉
        (function() {
            var btn = document.getElementById('hamburger-btn');
            var links = document.getElementById('navbar-links');
            if (btn && links) {
                btn.addEventListener('click', function() {
                    links.classList.toggle('open');
                    btn.setAttribute('aria-expanded', links.classList.contains('open'));
                });
                // ナビリンクをタップしたらメニューを閉じる
                links.querySelectorAll('a').forEach(function(a) {
                    a.addEventListener('click', function() {
                        links.classList.remove('open');
                    });
                });
            }
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
