{% extends "layout.html" %}
{% block title %}魚種コード登録{% endblock %}

{% block head %}
<style>
    .form-wrap {
        max-width: 420px;
        margin: 0 auto;
    }
    .form-group {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .form-group label {
        font-weight: bold;
        min-width: 100px;
        flex-shrink: 0;
    }
    .form-group input {
        flex: 1;
        min-width: 0;
    }
    .btn-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
    }
    .error-msg {
        color: #f44336;
        font-size: 12px;
        margin-top: 4px;
        display: none;
    }
    input.input-error {
        border-color: #f44336;
    }
</style>
{% endblock %}

{% block content %}
<h2 class="page-title">{% if fish_type %}魚種コード編集{% else %}魚種コード登録{% endif %}</h2>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="card form-wrap">
    <form method="post">
        <div class="form-group">
            <label for="code">魚種コード:</label>
            <input type="text" id="code" name="code"
                   value="{{ fish_type[0] if fish_type else '' }}"
                   inputmode="numeric" required>
        </div>
        <div class="form-group">
            <label for="name">魚種名:</label>
            <input type="text" id="name" name="name"
                   value="{{ fish_type[1] if fish_type else '' }}" required>
        </div>
        {% if edit_code %}
        <input type="hidden" name="edit_code" value="{{ edit_code }}">
        {% endif %}
        <div class="btn-row">
            <button type="submit" class="btn btn-primary">{% if fish_type %}更新{% else %}登録{% endif %}</button>
            <button type="button" class="btn btn-danger"
                    onclick="location.href='/fish_code_list'">キャンセル</button>
        </div>
    </form>
</div>
{% endblock %}
