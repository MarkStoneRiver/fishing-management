{% extends "layout.html" %}
{% block title %}魚種コード一覧{% endblock %}

{% block head %}
<style>
    .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 10px;
    }
    .code-table {
        width: 100%;
        border-collapse: collapse;
    }
    .code-table th,
    .code-table td {
        border: 1px solid var(--color-border);
        padding: 10px;
        text-align: center;
    }
    .code-table th {
        background-color: #f2f2f2;
        font-weight: bold;
        position: sticky;
        top: 0;
    }
    .code-table td:last-child {
        white-space: nowrap;
    }
    .scrollable {
        max-height: 60vh;
        overflow-y: auto;
        border: 1px solid var(--color-border);
        border-radius: 4px;
    }
    .btn-edit {
        display: inline-block;
        padding: 5px 12px;
        font-size: 13px;
        border: 2px solid var(--color-text);
        background-color: var(--color-white);
        color: var(--color-text);
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
    }
    .btn-edit:hover { background-color: #f0f0f0; }
    .btn-del {
        display: inline-block;
        padding: 5px 12px;
        font-size: 13px;
        border: 2px solid var(--color-danger);
        background-color: var(--color-white);
        color: var(--color-danger);
        border-radius: 6px;
        cursor: pointer;
        margin-left: 6px;
    }
    .btn-del:hover { background-color: var(--color-danger-bg); }
</style>
{% endblock %}

{% block content %}
<h2 class="page-title">魚種コード一覧</h2>

<div class="card">
    <div class="list-header">
        <a href="/fish_code" class="btn btn-primary">＋ 新規登録</a>
    </div>
    <div class="scrollable">
        <table class="code-table">
            <thead>
                <tr>
                    <th>コード</th>
                    <th>魚種名</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for fish in fish_types %}
                <tr>
                    <td>{{ fish[0] }}</td>
                    <td>{{ fish[1] }}</td>
                    <td>
                        <a href="/fish_code?edit_code={{ fish[0] }}" class="btn-edit">編集</a>
                        <form action="/fish_code_delete" method="post" style="display: inline;">
                            <input type="hidden" name="code" value="{{ fish[0] }}">
                            <button type="submit" class="btn-del"
                                    onclick="return confirm('本当に削除しますか？')">削除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
